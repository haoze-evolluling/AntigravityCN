<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Antigravity 简体中文汉化工具</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <!-- Background Glow Orbs -->
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>

    <div class="app-container">
        <!-- Titlebar (Draggable) -->
        <header class="titlebar" style="--wails-draggable:drag">
            <div class="brand">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 17L12 22L22 17" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 12L12 17L22 12" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <defs>
                            <linearGradient id="logo-grad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#38BDF8"/>
                                <stop offset="0.5" stop-color="#818CF8"/>
                                <stop offset="1" stop-color="#C084FC"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="brand-text">
                    <span class="title">AntigravityCN</span>
                    <span class="version-badge">v1.0 便携版</span>
                </div>
            </div>
            <div class="window-controls" style="--wails-draggable:no-drag">
                <button id="btn-minimize" class="ctrl-btn" title="最小化">
                    <svg viewBox="0 0 16 16" width="12" height="12"><path fill="currentColor" d="M2 8h12v1H2z"/></svg>
                </button>
                <button id="btn-close" class="ctrl-btn close-btn" title="关闭">
                    <svg viewBox="0 0 16 16" width="12" height="12"><path fill="currentColor" d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.749.749 0 0 1 1.275.326.749.749 0 0 1-.215.734L9.06 8l3.22 3.22a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L8 9.06l-3.22 3.22a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/></svg>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Path & Detection Card -->
            <section class="glass-card path-card">
                <div class="card-header">
                    <div class="card-title">
                        <svg viewBox="0 0 20 20" fill="currentColor" class="card-icon">
                            <path d="M2 4.75C2 3.784 2.784 3 3.75 3h3.586a1.75 1.75 0 0 1 1.237.513l1.414 1.414a.25.25 0 0 0 .177.073h6.086C17.216 5.086 18 5.87 18 6.836v8.414c0 .966-.784 1.75-1.75 1.75H3.75A1.75 1.75 0 0 1 2 15.25V4.75Z"/>
                        </svg>
                        <span>Antigravity 目标路径 (app.asar)</span>
                    </div>
                    <button id="btn-refresh" class="icon-action-btn" title="重新检测状态">
                        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
                            <path fill-rule="evenodd" d="M15.312 11.424a5.5 5.5 0 0 1-9.201 2.466l-.312-.311h2.451a.75.75 0 0 0 0-1.5H4.5a.75.75 0 0 0-.75.75v3.75a.75.75 0 0 0 1.5 0v-2.096l.487.487a7 7 0 0 0 11.83-3.07.75.75 0 0 0-1.255-.476ZM4.688 8.576a5.5 5.5 0 0 1 9.201-2.466l.312.311H11.75a.75.75 0 0 0 0 1.5H15.5a.75.75 0 0 0 .75-.75V3.421a.75.75 0 0 0-1.5 0v2.096l-.487-.487a7 7 0 0 0-11.83 3.07.75.75 0 0 0 1.255.476Z" clip-rule="evenodd"/>
                        </svg>
                        <span>刷新</span>
                    </button>
                </div>
                <div class="path-input-group">
                    <input type="text" id="input-path" class="text-input" placeholder="请选择或输入 app.asar 路径..." readonly>
                    <button id="btn-browse" class="btn btn-secondary">
                        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
                            <path d="M10.75 4.75a.75.75 0 0 0-1.5 0v4.5h-4.5a.75.75 0 0 0 0 1.5h4.5v4.5a.75.75 0 0 0 1.5 0v-4.5h4.5a.75.75 0 0 0 0-1.5h-4.5v-4.5Z"/>
                        </svg>
                        <span>浏览...</span>
                    </button>
                </div>

                <!-- Status Pills -->
                <div class="status-bar">
                    <div class="status-pill" id="pill-install">
                        <span class="status-dot"></span>
                        <span class="status-label">安装状态:</span>
                        <span class="status-value">检测中...</span>
                    </div>
                    <div class="status-pill" id="pill-backup">
                        <span class="status-dot"></span>
                        <span class="status-label">备份状态:</span>
                        <span class="status-value">检测中...</span>
                    </div>
                    <div class="status-pill" id="pill-running">
                        <span class="status-dot"></span>
                        <span class="status-label">运行状态:</span>
                        <span class="status-value">检测中...</span>
                    </div>
                </div>
            </section>

            <!-- Actions Bar -->
            <section class="actions-container">
                <button id="btn-apply" class="btn btn-primary glow-btn">
                    <div class="btn-glow"></div>
                    <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
                        <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0 1 12 2v5h4a1 1 0 0 1 .82 1.573l-7 10A1 1 0 0 1 8 18v-5H4a1 1 0 0 1-.82-1.573l7-10a1 1 0 0 1 1.12-.38Z" clip-rule="evenodd"/>
                    </svg>
                    <span>一键安装汉化</span>
                </button>
                <button id="btn-restore" class="btn btn-glass">
                    <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
                        <path fill-rule="evenodd" d="M7.793 2.232a.75.75 0 0 1-.025 1.06L3.622 7.25h10.003a5.375 5.375 0 0 1 0 10.75H10.75a.75.75 0 0 1 0-1.5h2.875a3.875 3.875 0 0 0 0-7.75H3.622l4.146 3.957a.75.75 0 0 1-1.036 1.085l-5.5-5.25a.75.75 0 0 1 0-1.085l5.5-5.25a.75.75 0 0 1 1.061.025Z" clip-rule="evenodd"/>
                    </svg>
                    <span>还原英文原版</span>
                </button>
                <button id="btn-launch" class="btn btn-emerald">
                    <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
                        <path d="M6.3 2.84A1.5 1.5 0 0 0 4 4.11v11.78a1.5 1.5 0 0 0 2.3 1.27l9.344-5.891a1.5 1.5 0 0 0 0-2.538L6.3 2.841Z"/>
                    </svg>
                    <span>启动 Antigravity</span>
                </button>
            </section>

            <!-- Terminal Console Card -->
            <section class="glass-card terminal-card">
                <div class="terminal-header">
                    <div class="terminal-dots">
                        <span class="dot dot-red"></span>
                        <span class="dot dot-yellow"></span>
                        <span class="dot dot-green"></span>
                    </div>
                    <div class="terminal-title">
                        <svg viewBox="0 0 16 16" fill="currentColor" width="13" height="13">
                            <path fill-rule="evenodd" d="M2 3.75C2 2.784 2.784 2 3.75 2h8.5c.966 0 1.75.784 1.75 1.75v8.5A1.75 1.75 0 0 1 12.25 14h-8.5A1.75 1.75 0 0 1 2 12.25v-8.5Zm3.22 2.97a.75.75 0 0 0 0 1.06l2.25 2.25a.75.75 0 0 0 1.06-1.06L7.06 7.5l1.47-1.47a.75.75 0 0 0-1.06-1.06L5.22 6.72Zm4.53 4.03a.75.75 0 0 0 0 1.5h2.5a.75.75 0 0 0 0-1.5h-2.5Z" clip-rule="evenodd"/>
                        </svg>
                        <span>EXECUTION LOGS</span>
                    </div>
                    <div class="terminal-actions">
                        <button id="btn-copy-log" class="term-btn" title="复制日志">
                            <svg viewBox="0 0 16 16" fill="currentColor" width="13" height="13">
                                <path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25v-7.5Z"/>
                                <path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25v-7.5Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25h-7.5Z"/>
                            </svg>
                        </button>
                        <button id="btn-clear-log" class="term-btn" title="清空控制台">
                            <svg viewBox="0 0 16 16" fill="currentColor" width="13" height="13">
                                <path fill-rule="evenodd" d="M5 3.25V4H2.75a.75.75 0 0 0 0 1.5h.3l.815 8.15A1.5 1.5 0 0 0 5.357 15h5.285a1.5 1.5 0 0 0 1.493-1.35l.815-8.15h.3a.75.75 0 0 0 0-1.5H11v-.75A2.25 2.25 0 0 0 8.75 1h-1.5A2.25 2.25 0 0 0 5 3.25Zm2.25-.75a.75.75 0 0 0-.75.75V4h3v-.75a.75.75 0 0 0-.75-.75h-1.5ZM6.05 6a.75.75 0 0 1 .787.713l.275 5.5a.75.75 0 0 1-1.498.074l-.275-5.5A.75.75 0 0 1 6.05 6Zm3.9 0a.75.75 0 0 1 .712.787l-.275 5.5a.75.75 0 0 1-1.498-.074l.275-5.5a.75.75 0 0 1 .786-.713Z" clip-rule="evenodd"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div id="terminal-body" class="terminal-body">
                    <div class="log-line log-system">Antigravity 简体中文深度汉化工具已就绪。</div>
                </div>
            </section>
        </main>
    </div>

    <!-- Process Conflict Modal -->
    <div id="modal-conflict" class="modal-backdrop hidden">
        <div class="modal-card">
            <div class="modal-icon-wrap warning-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
            </div>
            <h3 class="modal-title">检测到 Antigravity 正在运行</h3>
            <p class="modal-desc">为避免 Windows 出现文件锁定占用冲突，建议先关闭 Antigravity 再进行汉化或还原操作。</p>
            <div class="modal-actions">
                <button id="modal-btn-cancel" class="btn btn-glass">我先手动保存关闭</button>
                <button id="modal-btn-autoclose" class="btn btn-primary">协助关闭并继续</button>
            </div>
        </div>
    </div>

    <!-- Alert / Toast -->
    <div id="toast" class="toast hidden"></div>

    <script src="./src/main.js"></script>
</body>
</html>
